services:
  - type: web
    name: weathergpt
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4

      - key: DEBUG
        value: "false"

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite

      - key: DATABASE_URL
        value: sqlite:///./weathergpt.db

      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1/forecast

      - key: OPEN_METEO_GEOCODING_URL
        value: https://geocoding-api.open-meteo.com/v1/search

      - key: IMD_WARNING_BASE_URL
        value: https://mausam.imd.gov.in/api/warnings_district_api.php